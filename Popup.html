<!DOCTYPE html>
<html>
<head>
  <title>Text-Zusammenfasser Pro</title>
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
      color: #333;
      margin: 0;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #4285f4;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 14px;
      color: #555;
      margin: 0 0 8px 0;
    }

    .section {
      margin-bottom: 16px;
    }

    .action-section {
      background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .action-section h3 {
      color: white;
      margin-bottom: 12px;
    }

    .action-section p {
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    #summarize-article-btn {
      background: white;
      color: #4285f4;
      font-weight: 500;
    }

    #summarize-article-btn:hover {
      background: #f5f5f5;
    }

    .shortcut-hint {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 8px;
      color: white;
    }

    .instruction {
      background-color: #f5f5f5;
      border-left: 4px solid #4285f4;
      padding: 12px;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    ol {
      padding-left: 20px;
      margin: 8px 0;
    }

    li {
      margin-bottom: 6px;
    }

    .footer {
      font-size: 12px;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 16px;
    }

    button {
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      display: block;
      width: 100%;
      margin-top: 8px;
    }

    button:hover {
      background: #3367d6;
    }

    #last-summary {
      margin-top: 16px;
      display: none;
    }

    #summary-content {
      background: #f0f7ff;
      border: 1px solid #d0e3ff;
      border-radius: 4px;
      padding: 12px;
      font-size: 14px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .article-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #e8f5e9;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #2e7d32;
    }

    .article-status.no-article {
      background: #fff3e0;
      color: #e65100;
    }

    .status-icon {
      font-size: 16px;
    }

    .divider {
      border-top: 1px solid #eee;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h2>Text-Zusammenfasser Pro</h2>

  <div class="action-section">
    <h3>Artikel zusammenfassen <span class="shortcut-hint">Alt+S</span></h3>
    <div id="article-status" class="article-status">
      <span class="status-icon">...</span>
      <span id="status-text">Prüfe Seite...</span>
    </div>
    <button id="summarize-article-btn">Artikel auf dieser Seite zusammenfassen</button>
  </div>

  <div class="divider"></div>

  <div class="section">
    <h3>Manuelle Zusammenfassung</h3>
    <div class="instruction">
      <ol>
        <li>Markiere Text auf einer Webseite</li>
        <li>Rechtsklick → "Text zusammenfassen"</li>
        <li>Wähle Tonalität in der Seitenleiste</li>
      </ol>
    </div>
  </div>

  <div id="last-summary" class="section">
    <h3>Letzte Zusammenfassung:</h3>
    <div id="summary-content"></div>
    <button id="export-button">Als Markdown exportieren</button>
  </div>

  <div class="footer">
    Text-Zusammenfasser Pro v1.3
  </div>

  <script src="Popup.js"></script>
</body>
</html>
